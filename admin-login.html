<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Admin login for UrbanEats dashboard." />
  <title>Admin Login - UrbanEats</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="admin-auth" data-admin-auth>
    <div class="admin-auth__card">
      <p class="admin-auth__tag">Admin Access</p>
      <h1 class="admin-auth__title">UrbanEats Dashboard Login</h1>
      <p class="admin-auth__desc" data-admin-auth-hint>Checking setup...</p>

      <form class="admin-auth__form" data-admin-auth-form>
        <label>
          Username
          <input type="text" name="username" required autocomplete="username" />
        </label>

        <label>
          Password
          <input type="password" name="password" required autocomplete="current-password" />
        </label>

        <button class="btn btn--accent btn--lg" type="submit" data-admin-auth-submit>
          Continue
        </button>
      </form>

      <p class="admin-auth__feedback" data-admin-auth-feedback></p>
      <p class="admin-auth__back"><a href="index.html">Back to website</a></p>
    </div>
  </main>

  <script src="admin.js"></script>
</body>
</html>
